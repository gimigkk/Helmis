# ============================================================
# Helmis — docker-compose.yml
#
# Services:
#   waha      — WhatsApp HTTP API bridge (GOWS engine)
#   agent     — Helmis Autonomous Agent (Gemini ReAct Brain & Storage)
#   scheduler — Cron container for proactive message triggers
#
# All services share the "helmis-net" bridge network.
# Persistent data lives under ./data/ (gitignored).
# ============================================================

networks:
  helmis-net:
    driver: bridge

volumes:
  waha-sessions:
    driver: local

services:

  # ----------------------------------------------------------
  # WAHA — WhatsApp HTTP API Bridge
  # Docs: https://waha.devlike.pro
  # Engine: GOWS (lightweight, native)
  # ----------------------------------------------------------
  waha:
    image: devlikeapro/waha:latest
    container_name: helmis-waha
    restart: unless-stopped
    networks:
      - helmis-net
    ports:
      - "${WAHA_PORT_MAPPING:-3000:3000}"           # REST API + dashboard
    volumes:
      - waha-sessions:/app/.sessions
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_PRINT_QR: "True"
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      # Forward incoming message events to Helmis Agent webhook receiver
      WHATSAPP_HOOK_URL: http://agent:${HERMES_WEBHOOK_PORT:-8644}/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message"
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------
  # Helmis Agent — Autonomous Multi-Step ReAct AI Brain
  # Handles WhatsApp routing, multi-key cascade, Voice Notes,
  # multimodal OCR, semantic vector memory, and disk storage.
  # ----------------------------------------------------------
  agent:
    build:
      context: ./helmis-agent
      dockerfile: Dockerfile
    container_name: helmis-agent
    restart: unless-stopped
    networks:
      - helmis-net
    volumes:
      - ./config:/hermes-config:ro,z
      - ./data:/app/data:z
    environment:
      WAHA_BASE_URL: ${WAHA_BASE_URL}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION_NAME: ${WAHA_SESSION_NAME:-default}
      GILANG_PHONE: ${GILANG_PHONE}
      BUNGA_PHONE: ${BUNGA_PHONE}
      BOT_PHONE: ${BOT_PHONE}
      TRIO_GROUP_JID: ${TRIO_GROUP_JID:-120363411261097957@g.us}
      MCP_WAHA_PORT: ${MCP_WAHA_PORT:-8765}
      HERMES_WEBHOOK_PORT: ${HERMES_WEBHOOK_PORT:-8644}
      GEMINI_KEY_1: ${GEMINI_KEY_1:-}
      GEMINI_KEY_2: ${GEMINI_KEY_2:-}
      GEMINI_KEY_3: ${GEMINI_KEY_3:-}
      GEMINI_KEY_4: ${GEMINI_KEY_4:-}
      GEMINI_KEY_5: ${GEMINI_KEY_5:-}
      GEMINI_KEY_6: ${GEMINI_KEY_6:-}
      TZ: ${TZ}
    depends_on:
      waha:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${HERMES_WEBHOOK_PORT:-8644}/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------
  # Scheduler — Proactive message cron trigger
  # Evaluates tasks and dispatches proactive reminders on due time.
  # ----------------------------------------------------------
  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: helmis-scheduler
    restart: unless-stopped
    networks:
      - helmis-net
    environment:
      HERMES_WEBHOOK_URL: http://agent:${HERMES_WEBHOOK_PORT:-8644}/webhooks/scheduler
      TZ: ${TZ}
    depends_on:
      - agent
