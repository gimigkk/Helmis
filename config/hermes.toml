# ============================================================
# config/hermes.toml — Hermes Agent configuration for Helmis
#
# Official docs: https://hermes-agent.nousresearch.com/docs/config
# ============================================================

[agent]
name = "Helmis"
system_prompt_file = "/hermes-config/system-prompt.md"
# Store all persistent state (memory, learned skills, logs) in the mounted volume
data_dir = "/hermes-data"
# Enable the learning loop — Helmis gets smarter over time
learning_loop = true
# Max context to keep in active memory per conversation
context_window_tokens = 64000

# ============================================================
# Model provider — Gemini via credential pool rotation
# Fallback chain: Pro (smartest) → Flash (fast) → 2.0 Flash (always on)
# ============================================================

[provider]
name = "gemini"
# Credential pool — Hermes round-robins across all three keys
# Each key must come from a separate Google account/project for independent quotas
credential_pool = ["${GEMINI_KEY_1}", "${GEMINI_KEY_2}", "${GEMINI_KEY_3}"]

[[provider.models]]
id = "gemini-2.5-pro"
role = "primary"
# Used for: complex reasoning, planning, document analysis

[[provider.models]]
id = "gemini-2.5-flash"
role = "fallback"
# Used when: primary hits rate limits or errors

[[provider.models]]
id = "gemini-2.0-flash"
role = "fallback"
# Used when: both above are unavailable (very high rate limit, always on)

# All three support vision and tool calling — no capability loss on fallback
vision = true
tool_calling = true

# ============================================================
# Webhook adapter — receives incoming events from WAHA and scheduler
# ============================================================

[webhook]
enabled = true
port = 8644

# WAHA sends incoming WhatsApp messages to this route
[[webhook.routes]]
path = "/webhooks/waha"
handler = "message"
# Map sender phone → name so Hermes knows who it's talking to
[webhook.routes.identity_map]
"${GILANG_PHONE}" = "Gilang"
"${BUNGA_PHONE}" = "Bunga"

# Scheduler sends proactive check triggers to this route
[[webhook.routes]]
path = "/webhooks/scheduler"
handler = "skill"
skill = "proactive-check"

# ============================================================
# MCP tool servers — external capabilities Hermes can invoke
# ============================================================

[[mcp.servers]]
name = "waha"
# Hermes connects to mcp-waha container via stdio through the Docker network
command = ["python", "-m", "src.server"]
working_dir = "/mcp-waha"
description = "WhatsApp messaging tools: send messages, send media, get message history"

# ============================================================
# Skills — custom secretary capabilities
# ============================================================

[skills]
directory = "/hermes-config/skills"
# Hermes will auto-discover all SKILL.md files in subdirectories

# ============================================================
# Memory — persistent, tagged, unified brain
# ============================================================

[memory]
backend = "sqlite"
path = "/hermes-data/memory.db"
# Always store who a memory came from
tag_source = true
# How many relevant memories to inject into each request
retrieval_limit = 20

# ============================================================
# Execution sandbox — Docker-in-Docker for tool safety
# ============================================================

[execution]
backend = "docker"
image = "python:3.12-slim"
# Hermes uses this to safely run terminal commands and code
