# ============================================================
# Hermes Agent Configuration for Helmis
# ============================================================
_config_version: 12

model:
  default: "google/gemini-2.5-flash"
  provider: "google"

fallback:
  enabled: true
  chain:
    - "google/gemini-2.0-flash"
    - "google/gemini-1.5-pro"

agent:
  system_prompt_file: "/hermes-config/system-prompt.md"
  skills_dir: "/hermes-config/skills"

mcp:
  servers:
    waha:
      url: "http://mcp-waha:8765/sse"
      type: "sse"
